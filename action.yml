name: MyCrobo review
description: Find security risks, AI slop, coding gaps and loose ends in pull requests, in any language.
author: MyCrobo
branding:
  icon: shield
  color: purple

inputs:
  path:
    description: Directory to scan, relative to the repository root.
    default: "."
  fail-on:
    description: Fail the check if a finding is at or above this severity (critical, high, medium, low, info, none).
    default: high
  severity:
    description: Hide findings below this severity.
    default: info
  comment:
    description: Post inline review comments and a summary comment on the pull request.
    default: "true"
  max-comments:
    description: Maximum inline comments per run.
    default: "20"
  upload-sarif:
    description: "Upload results to GitHub code scanning (needs `security-events: write`)."
    default: "true"
  ai:
    description: Also run the Claude review (needs anthropic-api-key).
    default: "false"
  anthropic-api-key:
    description: Anthropic API key, from a repository secret. Only used when ai is true.
    required: false
    default: ""
  model:
    description: Claude model for the AI review.
    default: claude-opus-5-5
  max-cost:
    description: Maximum AI spend per run, in USD.
    default: "1.00"
  github-token:
    description: Token used to comment on the pull request.
    default: ${{ github.token }}

outputs:
  sarif-file:
    description: Path of the SARIF report.
    value: ${{ steps.scan.outputs.sarif-file }}
  exit-code:
    description: 0 = passed, 1 = findings at or above fail-on, 2 = error.
    value: ${{ steps.scan.outputs.exit-code }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install MyCrobo
      shell: bash
      run: python -m pip install --quiet --disable-pip-version-check "$GITHUB_ACTION_PATH"

    # Inputs reach the script only through env vars, never `${{ }}` inside `run:`,
    # so a crafted input can't inject shell commands.
    - name: Scan
      id: scan
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        MYCROBO_PATH: ${{ inputs.path }}
        MYCROBO_FAIL_ON: ${{ inputs.fail-on }}
        MYCROBO_SEVERITY: ${{ inputs.severity }}
        MYCROBO_COMMENT: ${{ inputs.comment }}
        MYCROBO_MAX_COMMENTS: ${{ inputs.max-comments }}
        MYCROBO_AI: ${{ inputs.ai }}
        MYCROBO_MODEL: ${{ inputs.model }}
        MYCROBO_MAX_COST: ${{ inputs.max-cost }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        # Shallow checkouts may lack the base commit; fetch it so the diff works.
        if [ -n "$BASE_SHA" ] && ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
          git fetch --no-tags --quiet origin "$BASE_SHA" || echo "::warning::could not fetch base commit $BASE_SHA"
        fi
        sarif="$RUNNER_TEMP/mycrobo.sarif"
        args=(ci "$MYCROBO_PATH" --sarif "$sarif" --fail-on "$MYCROBO_FAIL_ON" --severity "$MYCROBO_SEVERITY"
              --max-comments "$MYCROBO_MAX_COMMENTS")
        [ "$MYCROBO_COMMENT" = "true" ] || args+=(--no-comment)
        [ "$MYCROBO_AI" = "true" ] && args+=(--ai --model "$MYCROBO_MODEL" --max-cost "$MYCROBO_MAX_COST")
        set +e
        mycrobo "${args[@]}"
        code=$?
        set -e
        echo "sarif-file=$sarif" >> "$GITHUB_OUTPUT"
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

    # Upload even when the gate failed: that is when the results matter most.
    - name: Upload to code scanning
      if: always() && inputs.upload-sarif == 'true' && steps.scan.outputs.sarif-file != ''
      continue-on-error: true  # private repos without code scanning still get comments and the summary
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.scan.outputs.sarif-file }}
        category: mycrobo

    - name: Apply the fail-on gate
      if: always()
      shell: bash
      env:
        EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        MYCROBO_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        if [ "$EXIT_CODE" = "1" ]; then echo "::error::MyCrobo found issues at or above '$MYCROBO_FAIL_ON'"; exit 1; fi
        if [ "$EXIT_CODE" != "0" ]; then echo "::error::MyCrobo failed to run (exit $EXIT_CODE)"; exit 1; fi
